name: 🧪 CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    ci:
        name: 🧪 CI
        uses: devidence-dev/workflows/.github/workflows/ci-gnome-extension.yml@v2
        permissions:
            contents: read
            id-token: write

    shader-render:
        name: 🎨 Shader render
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Install GL libraries
              run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libglx-mesa0 libgl1-mesa-dri
            - name: Install Python packages
              run: pip install moderngl==5.13.0 numpy==2.5.5 pillow==13.0.0
            - name: Render arrow shader cases
              run: npm run glsl:render
