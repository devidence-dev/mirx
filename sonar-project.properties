# projectKey/organization confirmed in SonarCloud -> Project Information (2026-11-10).
sonar.organization=devidence-dev
sonar.projectKey=devidence-dev_mirx
sonar.sourceEncoding=UTF-8

sonar.sources=src,extension.js,prefs.js,scripts
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js

sonar.exclusions=dist/**,openspec/**,docs/**,graphify-out/**,node_modules/**,**/*.md

sonar.javascript.lcov.reportPaths=lcov.info

# GNOME-bound adapters (loaded by the tests through vm, so Node's coverage does not measure them) and
# composition/entry files - same criterion as the composition files in the other repos: not worth mocking
# GNOME Shell just to raise the coverage number.
sonar.coverage.exclusions=src/ui/**,src/platform/**,extension.js,prefs.js,scripts/**
